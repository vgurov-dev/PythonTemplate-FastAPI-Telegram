version: '3.8'

services:
  backend:
    image: ghcr.io/vgurov-dev/telegram-template/backend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    environment:
      - APP_DEBUG=false
      - APP_RELOAD=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    image: ghcr.io/vgurov-dev/telegram-template/bot:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      - BOT_DEBUG=false

  webapp:
    image: ghcr.io/vgurov-dev/telegram-template/webapp:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: myservice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d myservice"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    image: ghcr.io/vgurov-dev/telegram-template/backend:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    command: celery -A src.backend.app.main.celery worker --loglevel=info

volumes:
  postgres_data:
  redis_data: