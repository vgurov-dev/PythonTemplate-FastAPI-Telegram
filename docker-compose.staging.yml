version: '3.8'

services:
  # ==================== APP SERVICES ====================

  backend:
    image: ghcr.io/vgurov-dev/telegram-template/backend:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    environment:
      - APP_DEBUG=false
      - APP_RELOAD=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=backend
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  bot:
    image: ghcr.io/vgurov-dev/telegram-template/bot:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      - BOT_DEBUG=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=bot
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
    networks:
      - app-network

  webapp:
    image: ghcr.io/vgurov-dev/telegram-template/webapp:${TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: myservice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d myservice"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  celery_worker:
    image: ghcr.io/vgurov-dev/telegram-template/backend:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    command: celery -A app.main.celery worker --loglevel=info
    networks:
      - app-network

  # ==================== NGINX ====================

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - webapp
      - grafana
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
    networks:
      - app-network

  # ==================== MONITORING ====================

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - app-network

  postgres_exporter:
    image: prometheuscommunity/postgres_exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://user:${POSTGRES_PASSWORD}@postgres:5432/myservice"
      POSTGRES_METRICS_ENABLED: "true"
      POSTGRES_DISABLE_METRICS: ""
    depends_on:
      - postgres
    networks:
      - app-network

  redis_exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      - redis
    networks:
      - app-network

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    restart: unless-stopped
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    depends_on:
      - nginx
    networks:
      - app-network

  loki:
    image: grafana/loki:2.9
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network

  grafana:
    image: grafana/grafana:10
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
    networks:
      - app-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    command: ["--config", "/etc/otelcol-contrib/config.yml"]
    networks:
      - app-network

  tempo:
    image: grafana/tempo:2.3
    restart: unless-stopped
    volumes:
      - tempo_data:/var/tempo
    command:
      - -config.file=/etc/tempo-config.yaml
    networks:
      - app-network

  # ==================== DOCKER SOCKET PROXY ====================

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      IMAGES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  # ==================== PORTAINER ====================

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - portainer_data:/data
    environment:
      - PORTAINER_PASSWORD=${PORTAINER_PASSWORD}
    depends_on:
      - docker-socket-proxy
    networks:
      - app-network

  # ==================== DASHBOARDS ====================

  dashboards:
    image: ghcr.io/vgurov-dev/telegram-template/dashboards:${TAG:-latest}
    restart: unless-stopped
    volumes:
      - ./monitoring/dashboards:/dashboards
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
  tempo_data:
  portainer_data: