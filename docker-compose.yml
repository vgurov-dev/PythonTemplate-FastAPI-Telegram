version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src/backend:/app
    command: poetry run uvicorn src.backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  bot:
    build:
      context: .
      dockerfile: src/bot/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./src/bot:/app
    command: poetry run python -m src.bot.main

  webapp:
    build:
      context: .
      dockerfile: src/webapp/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./src/webapp:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myservice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery_worker:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./src/backend:/app
    command: poetry run celery -A src.backend.app.main.celery worker --loglevel=info

  celery_beat:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./src/backend:/app
    command: poetry run celery -A src.backend.app.main.celery beat --loglevel=info

volumes:
  postgres_data:
  redis_data: