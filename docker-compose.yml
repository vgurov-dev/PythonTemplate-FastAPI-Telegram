version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myservice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery_worker:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app
    command: celery -A app.main.celery worker --loglevel=info

  celery_beat:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app
    command: celery -A app.main.celery beat --loglevel=info

volumes:
  postgres_data:
  redis_data: